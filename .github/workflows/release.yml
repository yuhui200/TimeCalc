# 各平台安装包构建。
#
# 为什么需要 CI：Tauri **不支持交叉编译**。macOS 的 .dmg 只能在 macOS 上打、
# Linux 的 .AppImage 只能在 Linux 上打（依赖 webkit2gtk 等原生库），
# 从 Windows 出发无论怎么配都做不出来。GitHub Actions 免费提供三种 runner，
# 是拿到「全平台安装包」的标准做法。
#
# 触发方式：
#   1. 推 tag：      git tag v0.2.0 && git push origin v0.2.0
#   2. 手动触发：    Actions → 本工作流 → Run workflow，填一个 tag
#
# 同时构建移动端（Android APK / iOS 未签名 ipa）。移动端同样无法在本机出包：
# iOS 的 Xcode 只在 macOS 上运行，Android 需要完整 SDK。
#
# 产物默认进 **草稿** Release，确认无误后手动点 Publish 才会公开。
# 未做代码签名：macOS 首次打开需右键「打开」，Windows 可能弹 SmartScreen，
# Android 装的是 debug 签名的 APK，iOS 的 ipa 未签名、需自己重签。
# 要消除提示需配置签名证书（见文件末尾说明）。
name: 构建各平台安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动触发时要创建的 Release 标签'
        required: true
        default: 'v0.2.0'

# tauri-action 要往 Release 里传产物，需要写权限
permissions:
  contents: write

# 同一个 tag 重复触发时取消前一次，避免两个 job 抢着往同一个 Release 传文件
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查与单元测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: 打包 ${{ matrix.label }}
    needs: verify
    # 一个平台失败不影响其它平台继续出包
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            platform: windows-latest
            targets: ''
            # msi = WiX 安装包；nsis = 单文件 setup.exe
            args: '--bundles msi,nsis'
          - label: macos
            platform: macos-latest
            # 通用二进制：同一个 .dmg 同时支持 Apple Silicon 与 Intel
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin --bundles dmg'
          - label: linux
            platform: ubuntu-22.04
            targets: ''
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.platform }}

    env:
      # 推 tag 触发时用 tag 名；手动触发时用输入的 tag。
      # 抽成 env 有两个原因：一是不用在两个 with: 字段里重复这段表达式，
      # 二是它内含单引号——把它放进单引号标量里会让 YAML 解析直接失败。
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      # 22.04 而不是 24.04：Tauri 2 依赖 webkit2gtk-4.1，
      # 22.04 的版本组合是官方文档验证过的，24.04 上偶有 ABI 问题。
      - name: 安装 Linux 系统依赖
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          # 清单以 Tauri 官方文档为准（https://v2.tauri.app/start/prerequisites/），
          # 只多一个 patchelf（AppImage 打包用）。
          # 注意：**不要**加 libappindicator3-dev。它和下面这个
          # libayatana-appindicator3-dev 是同一个库的两套 fork，
          # 同时装会让 apt 解析失败——2026-09-14 的 v0.1.0 构建就是这样挂的。
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # Rust 依赖编译很慢，缓存后二次构建能从十几分钟降到几分钟
      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # 不需要手动设 VITE_TARGET：Tauri CLI 会注入 TAURI_ENV_PLATFORM，
      # vite.config.ts 据此自动切到 tauri 目标（关 PWA、改构建 target）。
      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: TimeCalc ${{ env.RELEASE_TAG }}
          releaseBody: |
            各平台安装包见下方 Assets。

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows | `*_x64-setup.exe` | NSIS 安装包，双击即装 |
            | Windows | `*_x64_en-US.msi` | WiX 安装包，适合批量部署 |
            | macOS | `*.dmg` | 通用二进制，Apple Silicon 与 Intel 通用 |
            | Linux | `*.AppImage` | 免安装，`chmod +x` 后直接运行 |
            | Linux | `*.deb` | Debian / Ubuntu 系 |
            | Android | `app-debug.apk` | debug 签名，允许安装未知来源即可直装 |
            | iOS | `TimeCalc-unsigned.ipa` | **未签名**，需用 AltStore / Sideloadly 自签后才能装 |

            > iOS 的 ipa 未做代码签名（需要 $99/年的 Apple 开发者账号）。
            > 用免费 Apple ID 自签的话，签名 **7 天后失效**，到期需重新签一次。
          # 默认草稿：确认产物无误后再手动 Publish
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # -------------------------------------------------------------------------
  # 移动端。产物先作为 workflow artifact 传，再由末尾的 attach-mobile 统一挂到
  # Release 上。**不在这里直接传 Release**：tauri-action 的 build job 也在写同一个
  # Release，两个 job 并行会撞车（谁先跑完谁创建，正文由先到的决定）。
  # -------------------------------------------------------------------------
  android:
    name: 打包 android
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor 7 的 Android 工程用 AGP 8.x，需要 JDK 17+；选 21 是因为
      # Gradle 8.11 对 21 是一等支持，且和本机验证过的版本一致。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # 显式装版本，不依赖 AGP 的自动下载：自动下载在 license 没接受时会静默失败，
      # 报错信息离真正原因很远。版本要和 android/variables.gradle 里的一致。
      - name: 安装 Android SDK 组件
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci

      # 必须用 build:capacitor 而不是 build——后者是 web 目标，会把
      # Service Worker 和 manifest 一起打进 APK，SW 在 WebView 里缓存旧资源。
      - run: npm run build:capacitor

      # android/ 在 .gitignore 里，每次由模板重新生成，保证可复现。
      # 用 cap:add:android 而不是裸的 cap add：它后面接了 sync-native.mjs，
      # 负责补回模板不会带的图标与精确闹钟权限（见脚本头部说明）。
      # 漏了不会构建失败，只会装到真机才发现——所以必须走这个入口。
      - run: npm run cap:add:android

      - name: 编译 debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: timecalc-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: 打包 ios
    needs: verify
    # Xcode 只在 macOS 上运行，这一步没有别的位置可放
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:capacitor

      # macOS runner 自带 CocoaPods，cap add 会自动跑 pod install。
      # 同理走 cap:add:ios，它会顺带把 AppIcon 换成 TimeCalc 的，
      # 并补上 SCHEDULE_EXACT_ALARM 之类的原生定制（iOS 侧会自动跳过）。
      - run: npm run cap:add:ios
      - run: npx cap sync ios

      - name: 确认 CocoaPods 依赖已就绪
        working-directory: ios/App
        run: |
          set -euo pipefail
          # Capacitor 在 PATH 里找不到 pod 时**只打一条 warning 就跳过** pod install
          # （见 @capacitor/cli 的 ios/update.js）。而 App.xcworkspace 是模板自带的空壳，
          # 真正的 contents.xcworkspacedata 由 pod install 生成——少了它，
          # 下一步的 xcodebuild -workspace 会以一个完全对不上号的错误失败。
          # 这里显式检查一次，把真正的原因讲清楚。
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            echo "✓ CocoaPods 依赖已就绪"
            exit 0
          fi
          echo "::warning::cap sync 没生成 App.xcworkspace/contents.xcworkspacedata，改为显式执行 pod install"
          pod install
          test -f App.xcworkspace/contents.xcworkspacedata

      # 不签名归档。没有 Apple 开发者账号（$99/年）就只能到这里——
      # 产出的 ipa 要用 AltStore / Sideloadly 拿自己的 Apple ID 重签才能装。
      - name: 归档（跳过签名）
        working-directory: ios/App
        run: |
          set -euo pipefail
          # Capacitor 的 iOS 模板里**没有共享 scheme**（工程里只有 project.pbxproj），
          # scheme 靠 Xcode 按 target 自动创建。先跑一次 -list 触发创建，
          # 再从中读出真实名字——写死 -scheme App 等于赌自动创建的行为不变。
          xcodebuild -list -workspace App.xcworkspace
          SCHEME=$(xcodebuild -list -json -workspace App.xcworkspace | python3 -c "
          import json, sys
          schemes = (json.load(sys.stdin).get('workspace') or {}).get('schemes') or []
          if not schemes:
              sys.exit('xcodebuild -list 没有返回任何 scheme，自动创建没生效')
          print(schemes[0])
          ")
          echo "使用 scheme：$SCHEME"

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TimeCalc.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打成未签名 ipa
        run: |
          set -euo pipefail
          # 不写死 App.app：产物名跟随 Xcode target 的 PRODUCT_NAME，
          # Capacitor 改过模板的话会变，这里用通配找。
          # 用 -print -quit 而不是 `| head -1`：后者在 set -o pipefail 下，
          # head 提前退出会让 find 收到 SIGPIPE 返回非零，把整步判成失败。
          APP_PATH=$(find "$RUNNER_TEMP/TimeCalc.xcarchive/Products/Applications" \
            -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "归档里没找到 .app，内容如下："
            ls -R "$RUNNER_TEMP/TimeCalc.xcarchive/Products" || true
            exit 1
          fi
          echo "找到 $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry TimeCalc-unsigned.ipa Payload
          ls -la TimeCalc-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: timecalc-ios
          path: ${{ runner.temp }}/ipa/TimeCalc-unsigned.ipa
          if-no-files-found: error

  # 所有平台的包都出完后，统一挂到同一个 Release 上。
  # 用 gh release upload 而不是 action-gh-release：前者只加附件，
  # 绝不会碰 release 正文——正文归 tauri-action 那个 job 所有。
  attach-mobile:
    name: 附加移动端产物到 Release
    needs: [build, android, ios]
    # 移动端任一个挂掉也要把已有的包传上去，所以用 always()；
    # 但 build 失败时 Release 根本不存在，那就没必要跑。
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 上传到 Release
        run: |
          set -euo pipefail
          # 用数组而不是把 find 结果塞进一个字符串：后者靠 shell 的词分割拆参数，
          # 路径里一旦有空格就会静默传错参数（少一个文件或传成两个不存在的路径）。
          mapfile -t FILES < <(find artifacts -type f \( -name '*.apk' -o -name '*.ipa' \))
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "没有找到 apk / ipa，跳过"
            exit 0
          fi
          printf '将要上传：%s\n' "${FILES[@]}"
          # --clobber：同 tag 重跑时覆盖同名附件，否则第二次会因重名失败
          gh release upload "$RELEASE_TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

# ---------------------------------------------------------------------------
# 如需消除系统安全提示（可选）
#
# macOS 签名与公证，在 build job 的 env 里补上：
#   APPLE_CERTIFICATE:            ${{ secrets.APPLE_CERTIFICATE }}            # .p12 的 base64
#   APPLE_CERTIFICATE_PASSWORD:   ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
#   APPLE_SIGNING_IDENTITY:       ${{ secrets.APPLE_SIGNING_IDENTITY }}       # 如 "Developer ID Application: Xxx (TEAMID)"
#   APPLE_ID:                     ${{ secrets.APPLE_ID }}
#   APPLE_PASSWORD:               ${{ secrets.APPLE_PASSWORD }}               # App 专用密码
#   APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}
#
# Windows 签名需要一张代码签名证书，用 signtool 签或者配置
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# 走 Tauri 自带的签名流程。
# ---------------------------------------------------------------------------
